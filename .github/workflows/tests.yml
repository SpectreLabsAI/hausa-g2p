name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run G2P suite
        run: python test_hausa_g2p.py

      - name: Run waxal_prep example suite
        run: python examples/waxal_prep/test_waxal_prep.py
        env:
          PYTHONPATH: .
